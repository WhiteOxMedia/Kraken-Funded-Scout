    "httpx==0.28.1",
    "httpx2>=2.13.1",
    "uvicorn==0.51.0",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "py-cpuinfo>=9.0.0",
    "py-vapid>=1.9.4",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "requests>=2.34.2",
    "segno>=1.6.6",
]
