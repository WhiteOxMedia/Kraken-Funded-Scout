<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" role="img" aria-label="The XMR Jackpot Miner — holding a signal-antenna pickaxe, wearing a miner helmet with an orange light and a Kraken Scout device on the belt">
  <!-- subtle geometric background: flat, low-contrast, professional -->
  <rect x="6" y="6" width="208" height="268" fill="#EDEEF0"/>
  <g stroke="#D9DBDF" stroke-width="1.5" fill="none">
    <path d="M6 210 L110 118 L214 210"/>
    <path d="M6 240 L110 148 L214 240"/>
    <circle cx="110" cy="80" r="44"/>
    <path d="M28 26 H74 M28 38 H58"/>
  </g>
  <circle cx="176" cy="44" r="14" fill="#D26E2B" opacity="0.12"/>
  <circle cx="34" cy="196" r="22" fill="#4C4C4C" opacity="0.06"/>

  <!-- ═══ THE MINER ═══ -->
  <g stroke="#3A3A3A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs + boots -->
    <path d="M96 208 V238 H88 V252 H106 V238" fill="#4C4C4C"/>
    <path d="M124 208 V238 H116 V252 H134 V238" fill="#4C4C4C"/>
    <path d="M84 252 H108 M112 252 H136" stroke-width="4"/>
    <!-- torso: slate work jacket -->
    <path d="M92 138 H128 L134 196 V212 H86 V196 Z" fill="#4C4C4C"/>
    <!-- orange accent stripe -->
    <path d="M92 186 H134" stroke="#D26E2B" stroke-width="5"/>
    <!-- left arm (down, steady) -->
    <path d="M92 142 L78 168 L82 192" fill="none" stroke-width="11"/>
    <circle cx="83" cy="196" r="7" fill="#EDEEF0"/>
    <!-- right arm (raised to the antenna-pickaxe) -->
    <path d="M128 142 L146 120 L138 98" fill="none" stroke-width="11"/>
    <circle cx="137" cy="94" r="7" fill="#EDEEF0"/>
    <!-- neck -->
    <path d="M104 128 H116 V140 H104 Z" fill="#EDEEF0"/>
    <!-- head -->
    <circle cx="110" cy="112" r="18" fill="#EDEEF0"/>
    <!-- helmet -->
    <path d="M90 108 A20 20 0 0 1 130 108 L130 112 H90 Z" fill="#F7F7F8"/>
    <path d="M84 112 H136" stroke-width="5"/>
    <!-- helmet lamp: orange, flat -->
    <circle cx="110" cy="92" r="7" fill="#D26E2B"/>
    <circle cx="110" cy="92" r="3" fill="#F4A261"/>
    <!-- face: calm, serious -->
    <circle cx="103" cy="116" r="2" fill="#3A3A3A" stroke="none"/>
    <circle cx="117" cy="116" r="2" fill="#3A3A3A" stroke="none"/>
    <path d="M104 124 Q110 127 116 124" fill="none" stroke-width="2"/>
  </g>

  <!-- ═══ THE SIGNAL-ANTENNA PICKAXE ═══ -->
  <g stroke="#3A3A3A" stroke-width="2" stroke-linejoin="round">
    <!-- handle -->
    <path d="M137 94 L152 40" stroke-width="6"/>
    <!-- head: pick blade + signal antenna -->
    <path d="M136 44 Q152 30 170 40 L166 50 Q152 42 140 52 Z" fill="#D26E2B"/>
    <path d="M152 40 V16" stroke="#D26E2B" stroke-width="3"/>
    <circle cx="152" cy="12" r="3.5" fill="#D26E2B" stroke="none"/>
    <path d="M146 20 Q152 14 158 20" fill="none" stroke="#D26E2B" stroke-width="2"/>
    <path d="M142 26 Q152 16 162 26" fill="none" stroke="#D26E2B" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- ═══ KRAKEN SCOUT DEVICE (belt) ═══ -->
  <g stroke="#3A3A3A" stroke-width="2">
    <path d="M92 160 H134" stroke-width="4"/>
    <rect x="122" y="152" width="16" height="12" rx="1" fill="#F7F7F8"/>
    <rect x="125" y="155" width="10" height="4" fill="#D26E2B" stroke="none"/>
    <path d="M125 161 H135" stroke-width="1.5"/>
  </g>
</svg>
