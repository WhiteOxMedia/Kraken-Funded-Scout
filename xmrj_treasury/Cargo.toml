[package]
name = "xmrj_treasury"
version = "0.1.0"
edition = "2021"

# A Solana program is BOTH halves: the cdylib is what ships as the deployed
# .so, the rlib is what a sibling program links against when it calls this
# program by CPI (xmrj_governance does exactly that). Without the cdylib
# crate-type, `anchor build` has no artifact to deploy.
[lib]
crate-type = ["cdylib", "lib"]
name = "xmrj_treasury"

[features]
default = []
# The `cpi` feature is what generates this program's cross-program-call
# surface: Anchor gates the generated `cpi` module behind it, so a caller that
# does not enable it cannot see `xmrj_treasury::cpi::*`. It implies
# no-entrypoint so the caller links the instruction code, never a second
# program entrypoint.
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# EXACTLY pinned with `=`, not a caret range. This workspace has no Cargo.lock
# yet (cargo has never run here), so a caret "1.1.2" would silently resolve to
# the newest 1.x the day one is published. The `=` keeps this crate's Anchor
# version equal to the CLI version Anchor.toml's [toolchain] pins — the
# agreement test_anchor_wiring.py section 13 enforces. The host compiler that
# builds it is pinned in rust-toolchain.toml (1.89.0, anchor-lang's MSRV).
anchor-lang = "=1.1.2"

# THE PROGRAM THIS ONE FUNDS. `features = ["cpi"]` is what generates
# xmrj_jackpot's cross-program-call surface at all: `xmrj_jackpot::cpi::*`
# (the instruction call and its accounts struct) and the
# `program::XmrjJackpot` marker this crate's FundJackpotWithXmr uses. Without
# the feature those paths do not exist and this crate cannot build. The path
# dep keeps ONE copy of the jackpot's account layout between caller and callee
# — the CPI is type-checked against the same source that declares the account,
# so a field added on one side stops the other side compiling. The dependency
# runs one way only (the jackpot does not depend on the treasury), so there is
# no cycle even though the two programs call and are called by each other at
# RUNTIME.
xmrj_jackpot = { path = "../xmrj_jackpot", features = ["cpi"] }
