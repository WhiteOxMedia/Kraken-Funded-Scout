[workspace]
members = [
    "xmrj_treasury",
    "xmrj_jackpot",
    "xmrj_governance",
    "xmrj_conversion_service"
]
# Editions 2021 already default to this; stated explicitly because the
# workspace's feature resolution is now load-bearing (the `cpi` features below
# decide whether a program's cross-program-call surface exists).
resolver = "2"

# THE RELEASE PROFILE ANCHOR GENERATES FOR A WORKSPACE, kept deliberately:
# overflow-checks STAY ON in the deployed program — checked arithmetic is a
# security property on-chain, not a debug convenience — and fat LTO with one
# codegen unit is what produces the smallest, most optimizable artifact.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
